[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lidar-diff-icp"
version = "0.0.1"
description = "Bare-earth DEMs of difference between 2008-era Minnesota lidar and USGS 3DEP, correcting early-survey navigation error"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Andrew D. Wickert", email = "awickert@umn.edu" }]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "laspy[lazrs]>=2.0",   # lazrs = LAZ read/write backend
    "pyproj",
    "rasterio",
    "matplotlib",
    "py4dgeo",   # M3C2 point-based cross-check (scripts/m3c2_pointcloud.py)
]

[project.optional-dependencies]
uncertainty = ["xdem"]  # calibrated heteroscedastic LoD (Hugonnet 2022); import needs PROJ_DATA unset

[project.urls]
Repository = "https://github.com/MNiMORPH/lidar-diff-icp"

[tool.setuptools.packages.find]
where = ["src"]
