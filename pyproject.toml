[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lidar-diff-icp"
version = "0.0.1"
description = "Bare-earth DEMs of difference between 2008-era Minnesota lidar and USGS 3DEP, correcting early-survey navigation error"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Andrew D. Wickert", email = "awickert@umn.edu" }]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "laspy[lazrs]>=2.0",   # lazrs = LAZ read/write backend
    "pyproj",
    "rasterio",
    "matplotlib",
    "scikit-image",        # ridge/vesselness filter (Sato 1998) for linear-feature detection
    # These four are imported by the LIBRARY and were previously undeclared, so a fresh
    # `pip install` produced a package that failed on import of the modules named:
    "pyarrow",             # q2cover.py -- the per-return beam-offset table is parquet
    "requests",            # references.py -- fetches the PROJ geoid grids when absent
    "pyshp",               # groundtruth/checkpoints.py -- reads control shapefiles
    "shapely",             # threedep.py -- 3DEP coverage geometry
    "catchment-dod-balance @ git+https://github.com/MNiMORPH/catchment-dod-balance.git",  # routed sediment mass-balance (own repo; edit there, consumed here)
    # Scherler & Schwanghart (2020) divide network, via Andy's verified reimplementation.
    # trace_ridgelines.py used to reach it with sys.path.insert("/home/awickert/dataanalysis/
    # r.fluvial") -- an absolute path into one machine's home directory, for a step
    # (ridge_mask) that is part of the six-step pipeline. Declared here 2026-09-06 so the
    # pipeline builds anywhere.
    "rivernetworkx @ git+https://github.com/awickert/r.fluvial.git",
]

[project.optional-dependencies]
uncertainty = ["xdem"]      # calibrated heteroscedastic LoD (Hugonnet 2022); import needs PROJ_DATA unset
m3c2 = ["py4dgeo"]          # point-based M3C2 cross-check (scripts/m3c2_pointcloud.py) -- not needed for the gridded product

[project.scripts]
# The derived-product chain as a command: what to run, in what order, and what is out of
# date. See src/lidar_diff_icp/workflow.py -- it prints, it does not execute, because
# several steps read multi-gigabyte clouds and regenerating an adopted product is a
# judgement rather than a scheduling detail.
lidar-diff-workflow = "lidar_diff_icp.workflow:main"
# The two standard per-site figures, rebuildable from the saved products alone.
lidar-diff-figures = "lidar_diff_icp.figures:main"

[project.urls]
Repository = "https://github.com/MNiMORPH/lidar-diff-icp"

[tool.setuptools.packages.find]
# TWO top-level packages, deliberately not one. `trust` is the provenance/gate system and
# is SEPARATE from the science library (Andy, 2026-09-09): it keeps its own namespace, so
# every existing `import trust.provenance` is unchanged, rather than becoming
# `lidar_diff_icp.trust` across 43 files. Declaring it here is also what makes it
# importable at all -- until now `trust` resolved only because everything ran with the
# repo root as CWD, an undeclared property that nothing tested and 43 files relied on.
# This does not foreclose splitting `trust` into its own distribution later; it is the
# step that has to happen first either way.
# `trust.hooks` is intentionally NOT a package (no __init__.py): its two files are invoked
# by absolute path from the hook settings, never imported.
where = ["src", "."]
include = ["lidar_diff_icp*", "trust*"]

[tool.pytest.ini_options]
# Without this, a bare `pytest` collects from the repo root and IMPORTS every analysis
# script matching test_*.py / *_test.py under analysis/ and scratchpad/. Those load derived
# data at import, so collection took 25 minutes and then aborted on two FileNotFoundErrors
# before a single test ran. Scoped here, the suite is ~10 s.
# ground_control/tests was OUTSIDE this list until 2026-09-07, so its 16 tests over 4342
# lines of datum code ran only when named explicitly -- five commits landed that day
# without them. Its test_apply_datum.py was renamed test_ground_control_apply_datum.py to
# collect alongside the pipeline's own test_apply_datum.py: different subjects, same name,
# and pytest cannot import both without packages.
testpaths = ["tests", "ground_control/tests"]
